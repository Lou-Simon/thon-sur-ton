<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="La rampe de poussée : nulle à la portée, 1 au contact, utilisée pour les parois, les obstacles et les voisins"><title>La rampe de poussée : nulle à la portée, 1 au contact, utilisée pour les parois, les obstacles et les voisins</title><rect width="1600" height="900" fill="#ffffff"/><path d="M160.0 560.0 L820.0 560.0" stroke-linecap="round" stroke="#6b7a90" stroke-width="3" fill="none"/><path d="M804.0 567.1 L820.0 560.0 L804.0 552.9" stroke-linecap="round" stroke-linejoin="round" stroke="#6b7a90" stroke-width="3" fill="none"/><path d="M160.0 560.0 L160.0 150.0" stroke-linecap="round" stroke="#6b7a90" stroke-width="3" fill="none"/><path d="M167.1 166.0 L160.0 150.0 L152.9 166.0" stroke-linecap="round" stroke-linejoin="round" stroke="#6b7a90" stroke-width="3" fill="none"/><path d="M160.0 200.0 L573.3 560.0" stroke-linecap="round" stroke="#1f6fd1" stroke-width="7" fill="none"/><path d="M573.3 560.0 L780.0 560.0" stroke-linecap="round" stroke="#1f6fd1" stroke-width="7" fill="none"/><path d="M148.0 200.0 L172.0 200.0" stroke-linecap="round" stroke="#6b7a90" stroke-width="3" fill="none"/><text x="130" y="210" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="end" fill="#6b7a90">1</text><text x="130" y="570" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="end" fill="#6b7a90">0</text><path d="M573.3 548.0 L573.3 572.0" stroke-linecap="round" stroke="#6b7a90" stroke-width="3" fill="none"/><text x="573.3333333333333" y="610" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="middle" fill="#6b7a90">portée</text><text x="160" y="610" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="middle" fill="#6b7a90">contact</text><text x="820" y="610" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="end" fill="#6b7a90">distance</text><text x="180" y="140" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="start" fill="#6b7a90">poussée</text><text x="683.3333333333333" y="536" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="middle" fill="#1f6fd1">plus loin : rien</text><text x="375" y="260" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="start" fill="#1f6fd1">tout près : fort</text><text x="900" y="170" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="34" text-anchor="start" fill="#091629">La même rampe, trois usages</text><rect x="900" y="215" width="620" height="86" rx="21" stroke="#8a8079" stroke-width="3" fill="#f6f1e7"/><text x="930" y="269" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="start" fill="#091629">Parois et sol</text><text x="1490" y="268" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="end" fill="#8a8079">portée 4</text><rect x="900" y="327" width="620" height="86" rx="21" stroke="#8a8079" stroke-width="3" fill="#f6f1e7"/><text x="930" y="381" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="start" fill="#091629">Plantes, coraux, rocher</text><text x="1490" y="380" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="end" fill="#8a8079">portée 4</text><rect x="900" y="439" width="620" height="86" rx="21" stroke="#1f6fd1" stroke-width="3" fill="#eef3fa"/><text x="930" y="493" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="start" fill="#091629">Voisins trop proches</text><text x="1490" y="492" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="end" fill="#1f6fd1">portée 3</text><text x="900" y="590" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="start" fill="#6b7a90">La poussée dépasse 1 si le thon</text><text x="900" y="628" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="start" fill="#6b7a90">a franchi une paroi.</text><rect x="80" y="730" width="1440" height="110" rx="32" stroke="#f2c230" stroke-width="3" fill="#fff6d6"/><text x="800" y="795.0" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="middle" fill="#091629">poussée = max(0, 1 − distance / portée)</text></svg>
