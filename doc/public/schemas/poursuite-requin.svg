<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="La poursuite du requin : il vise le point où sera le centre des thons qu'il voit dans 1 seconde, et ralentit à la distance de suivi de 4"><title>La poursuite du requin : il vise le point où sera le centre des thons qu'il voit dans 1 seconde, et ralentit à la distance de suivi de 4</title><rect width="1600" height="900" fill="#ffffff"/><ellipse cx="1010" cy="420" rx="150" ry="150" stroke="#6b7a90" stroke-width="3" stroke-dasharray="12 9" fill="#f1f3f6"/><g transform="translate(920 360) rotate(-90) scale(0.7)"><path d="M-44.5 0 L-73.1 -26.7 L-73.1 26.7 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="49.4" ry="22.1" fill="#091629"/></g><g transform="translate(970 315) rotate(-90) scale(0.7)"><path d="M-44.5 0 L-73.1 -26.7 L-73.1 26.7 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="49.4" ry="22.1" fill="#091629"/></g><g transform="translate(1095 340) rotate(-90) scale(0.7)"><path d="M-44.5 0 L-73.1 -26.7 L-73.1 26.7 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="49.4" ry="22.1" fill="#091629"/></g><g transform="translate(915 475) rotate(-90) scale(0.7)"><path d="M-44.5 0 L-73.1 -26.7 L-73.1 26.7 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="49.4" ry="22.1" fill="#091629"/></g><g transform="translate(1005 500) rotate(-90) scale(0.7)"><path d="M-44.5 0 L-73.1 -26.7 L-73.1 26.7 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="49.4" ry="22.1" fill="#091629"/></g><g transform="translate(1095 480) rotate(-90) scale(0.7)"><path d="M-44.5 0 L-73.1 -26.7 L-73.1 26.7 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="49.4" ry="22.1" fill="#091629"/></g><path d="M1010 404 L1010 192" stroke-linecap="round" stroke="#1f6fd1" stroke-width="4" stroke-dasharray="10 8" fill="none"/><path d="M999.8 214.8 L1010 192 L1020.2 214.8" stroke-linecap="round" stroke-linejoin="round" stroke="#1f6fd1" stroke-width="4" fill="none"/><ellipse cx="1010" cy="420" rx="11" ry="11" fill="#1f6fd1"/><ellipse cx="1010" cy="170" rx="13" ry="13" fill="#e5483a"/><g transform="translate(290 470) rotate(-22)" fill="#e5483a" stroke="#e5483a" stroke-width="2" stroke-linejoin="round"><path d="M-52.7 0 L-93.0 -34.1 L-93.0 34.1 Z"/><path d="M-18.6 -22.3 L-7.4 -58.9 L17.4 -22.3 Z"/><ellipse cx="0" cy="0" rx="62.0" ry="27.9"/></g><path d="M372 437 L984 181" stroke-linecap="round" stroke="#e5483a" stroke-width="6" fill="none"/><path d="M959.0 180.4 L984 181 L966.9 199.2" stroke-linecap="round" stroke-linejoin="round" stroke="#e5483a" stroke-width="6" fill="none"/><text x="1040" y="140" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="start" fill="#e5483a">le point visé :</text><text x="1040" y="176" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="start" fill="#e5483a">où sera le centre dans 1 s</text><text x="1038" y="226" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="start" fill="#1f6fd1">vitesse moyenne</text><text x="1038" y="258" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="start" fill="#1f6fd1">des thons vus</text><text x="1190" y="428" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="start" fill="#1f6fd1">centre des thons vus</text><path d="M1026 420 L1180 420" stroke="#1f6fd1" stroke-width="3" stroke-linecap="round" fill="none"/><text x="1010" y="614" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="middle" fill="#6b7a90">distance de suivi : 4</text><text x="60" y="150" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="34" text-anchor="start" fill="#091629">Le requin charge le banc</text><text x="60" y="192" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="start" fill="#6b7a90">il vise où le banc sera,</text><text x="60" y="226" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="start" fill="#6b7a90">pas où il est</text><text x="560" y="300" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="end" fill="#e5483a">il charge</text><text x="60" y="640" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="start" fill="#6b7a90">À la distance de suivi, il ralentit</text><text x="60" y="674" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="start" fill="#6b7a90">à la vitesse des thons.</text><text x="1540" y="690" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="end" fill="#6b7a90">Schéma pas à l'échelle.</text><rect x="80" y="740" width="1440" height="120" rx="32" stroke="#f2c230" stroke-width="3" fill="#fff6d6"/><text x="800" y="791" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="middle" fill="#091629">Il charge le centre, pas le thon le plus proche : les thons de part et d'autre</text><text x="800" y="829" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="middle" fill="#091629">fuient dans des directions opposées, et le banc éclate.</text></svg>