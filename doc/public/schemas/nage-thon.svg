<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="La nage du thon : il avance vers où il regarde, sa vitesse reste entre 2 et 5, sa queue bat"><title>La nage du thon : il avance vers où il regarde, sa vitesse reste entre 2 et 5, sa queue bat</title><rect width="1600" height="900" fill="#ffffff"/><rect x="80" y="70" width="440" height="590" rx="32" stroke="#f1f3f6" stroke-width="3" fill="#f1f3f6"/><text x="300" y="135" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="32" text-anchor="middle" fill="#091629">Il avance vers où il regarde</text><rect x="580" y="70" width="440" height="590" rx="32" stroke="#f1f3f6" stroke-width="3" fill="#f1f3f6"/><text x="800" y="135" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="32" text-anchor="middle" fill="#091629">Ni à l'arrêt, ni trop vite</text><rect x="1080" y="70" width="440" height="590" rx="32" stroke="#f1f3f6" stroke-width="3" fill="#f1f3f6"/><text x="1300" y="135" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="32" text-anchor="middle" fill="#091629">Sa queue bat</text><g transform="translate(230 420) rotate(-25)" opacity="1.0"><path transform="rotate(0.0 -53.4 0)" d="M-53.4 0 L-87.7 -32.0 L-87.7 32.0 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="59.3" ry="26.5" fill="#091629"/></g><path d="M300.0 387.0 L440.0 322.0" stroke-linecap="round" stroke="#1f6fd1" stroke-width="6" fill="none"/><path d="M423.6 340.9 L440.0 322.0 L415.0 322.4" stroke-linecap="round" stroke-linejoin="round" stroke="#1f6fd1" stroke-width="6" fill="none"/><text x="455" y="300" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="middle" fill="#1f6fd1">vitesse</text><text x="300" y="576" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="middle" fill="#6b7a90">sa vitesse : une direction,</text><text x="300" y="611" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="middle" fill="#6b7a90">une longueur</text><path d="M620.0 400.0 L980.0 400.0" stroke-linecap="round" stroke="#6b7a90" stroke-width="4" fill="none"/><rect x="740" y="378" width="180" height="44" rx="10" fill="#1f6fd1"/><path d="M620.0 366.0 L620.0 434.0" stroke-linecap="round" stroke="#6b7a90" stroke-width="4" fill="none"/><text x="620" y="478" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="middle" fill="#6b7a90">0</text><path d="M740.0 366.0 L740.0 434.0" stroke-linecap="round" stroke="#1f6fd1" stroke-width="4" fill="none"/><text x="740" y="478" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="middle" fill="#1f6fd1">2</text><path d="M920.0 366.0 L920.0 434.0" stroke-linecap="round" stroke="#1f6fd1" stroke-width="4" fill="none"/><text x="920" y="478" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="middle" fill="#1f6fd1">5</text><text x="830.0" y="350" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="middle" fill="#1f6fd1">vitesse permise</text><g transform="translate(800 270) rotate(0.0)" opacity="1.0"><path transform="rotate(0.0 -40.0 0)" d="M-40.0 0 L-65.8 -24.0 L-65.8 24.0 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="44.5" ry="19.9" fill="#091629"/></g><text x="800" y="576" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="middle" fill="#6b7a90">la longueur de la vitesse</text><text x="800" y="611" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="middle" fill="#6b7a90">reste entre 2 et 5</text><g transform="translate(1320 400) rotate(0)" opacity="0.3"><path transform="rotate(25 -75.6 0)" d="M-75.6 0 L-124.3 -45.3 L-124.3 45.3 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="84.0" ry="37.6" fill="#091629"/></g><g transform="translate(1320 400) rotate(0)" opacity="0.3"><path transform="rotate(-25 -75.6 0)" d="M-75.6 0 L-124.3 -45.3 L-124.3 45.3 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="84.0" ry="37.6" fill="#091629"/></g><g transform="translate(1320 400) rotate(0.0)" opacity="1.0"><path transform="rotate(0.0 -75.6 0)" d="M-75.6 0 L-124.3 -45.3 L-124.3 45.3 Z" stroke-linejoin="round" stroke="#f2c230" stroke-width="2" fill="#f2c230"/><ellipse cx="0" cy="0" rx="84.0" ry="37.6" fill="#091629"/></g><path d="M1178 340 A 80 80 0 0 0 1178 460" stroke="#6b7a90" stroke-width="3" stroke-dasharray="8 7" fill="none"/><text x="1150" y="300" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="middle" fill="#6b7a90">25°</text><text x="1150" y="520" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="26" text-anchor="middle" fill="#6b7a90">25°</text><text x="1300" y="576" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="middle" fill="#6b7a90">2 battements par seconde :</text><text x="1300" y="611" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" text-anchor="middle" fill="#6b7a90">l'apparence seulement</text><rect x="80" y="710" width="1440" height="130" rx="32" stroke="#f2c230" stroke-width="3" fill="#fff6d6"/><text x="800" y="766.0" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="middle" fill="#091629">À chaque pas : vitesse ← vitesse + somme des forces × durée du pas,</text><text x="800" y="804.0" font-family="Nunito, Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" text-anchor="middle" fill="#091629">puis sa longueur est ramenée entre 2 et 5.</text></svg>
